name: Installer

# `--install` depends on other projects' releases and download sites, so it runs weekly as well
on:
  push:
    branches: [main]
    paths:
      - src/osint_toolbox_mcp/install.py
      - src/osint_toolbox_mcp/locate.py
      - .github/workflows/installer.yml
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: Install every tool (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # Raises the GitHub API limit for the release lookups
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install and check every tool
        run: uv run osint-toolbox-mcp --install
      - name: The new tools answer
        if: runner.os == 'Linux'
        run: >
          uv run python scripts/try_tools.py
          subfinder_subdomain_search '{"domain": "example.com"}'
          dnstwist_lookalike_domains '{"domain": "example.com"}'
          dnsrecon_domain_scan '{"domain": "example.com"}'
          whois_lookup '{"query": "example.com"}'
          dns_lookup '{"name": "example.com"}'
          crtsh_certificate_search '{"domain": "example.com", "include_expired": false}'
          wayback_snapshots '{"url": "example.com", "limit": 3}'
